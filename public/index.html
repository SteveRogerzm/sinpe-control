<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de SINPE Móvil</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-emerald-600 text-white p-2 rounded-xl">
          <i class="fa-solid fa-wallet text-xl"></i>
        </div>
        <h1 class="text-xl font-bold text-slate-900 tracking-tight">SINPE<span class="text-emerald-600">Control</span></h1>
      </div>
      <div class="text-xs font-semibold px-3 py-1 rounded-full bg-emerald-100 text-emerald-700">
        ● Vercel Serverless
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <section class="lg:col-span-4 space-y-6">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
          <h2 class="text-lg font-bold text-slate-900 mb-1">Registrar Comprobante</h2>
          <p class="text-sm text-slate-500 mb-6">Sube la foto del SINPE para procesarla.</p>
          
          <form id="uploadForm" class="space-y-4">
            <div id="dropzone" class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:border-emerald-500 transition-colors cursor-pointer bg-slate-50">
              <input type="file" id="fileInput" name="comprobante" accept="image/*" class="hidden">
              <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-400 mb-2"></i>
              <p class="text-sm font-medium text-slate-700">Haz clic para elegir la foto</p>
            </div>

            <div id="previewContainer" class="hidden">
              <img id="imagePreview" src="" class="w-full h-48 object-cover rounded-xl border border-slate-200">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-4 rounded-xl shadow-sm transition-all flex items-center justify-center gap-2">
              <i class="fa-solid fa-bolt"></i> <span>Procesar SINPE</span>
            </button>
          </form>

          <div id="alertBox" class="mt-4 hidden p-4 rounded-xl text-sm"></div>
        </div>
      </section>

      <section class="lg:col-span-8 space-y-6">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
            <span class="text-xs font-semibold text-slate-400 uppercase">Total Comprobantes</span>
            <div id="totalCount" class="text-2xl font-bold text-slate-900 mt-1">0</div>
          </div>
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
            <span class="text-xs font-semibold text-slate-400 uppercase">Monto Total Acumulado</span>
            <div id="totalAmount" class="text-2xl font-bold text-emerald-600 mt-1">₡0.00</div>
          </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="p-5 border-b border-slate-200 flex items-center justify-between">
            <h3 class="font-bold text-slate-900">Histórico de Transacciones</h3>
            <button id="refreshBtn" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-1.5 rounded-lg">
              <i class="fa-solid fa-rotate-right mr-1"></i> Actualizar
            </button>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
              <thead>
                <tr class="bg-slate-50 text-slate-500 font-medium border-b border-slate-200">
                  <th class="p-4">Monto</th>
                  <th class="p-4">Referencia</th>
                  <th class="p-4">Emisor</th>
                  <th class="p-4">Fecha</th>
                  <th class="p-4 text-center">Comprobante</th>
                </tr>
              </thead>
              <tbody id="recordsTable" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const uploadForm = document.getElementById('uploadForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');
    const recordsTable = document.getElementById('recordsTable');

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('imagePreview').src = URL.createObjectURL(file);
        document.getElementById('previewContainer').classList.remove('hidden');
      }
    });

    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!fileInput.files[0]) return showAlert('Selecciona una imagen primero.', 'error');

      const formData = new FormData();
      formData.append('comprobante', fileInput.files[0]);

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Procesando con IA...`;

      try {
        const response = await fetch('/api/procesar', { method: 'POST', body: formData });
        const result = await response.json();

        if (!result.success) throw new Error(result.error);

        showAlert(`✅ Comprobante Ref: ${result.data.numero_referencia} guardado con éxito.`, 'success');
        uploadForm.reset();
        document.getElementById('previewContainer').classList.add('hidden');
        loadRecords();

      } catch (err) {
        showAlert(`⚠️ Error: ${err.message}`, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-bolt"></i> <span>Procesar SINPE</span>`;
      }
    });

    async function loadRecords() {
  try {
    const res = await fetch('/api/obtener_registros');
    const data = await res.json();

    recordsTable.innerHTML = '';
    let totalMonto = 0;

    if (Array.isArray(data) && data.length > 0) {
      data.forEach(row => {
        totalMonto += parseFloat(row.monto || 0);
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 transition-colors";
        tr.innerHTML = `
          <td class="p-4 font-bold text-slate-900">₡${Number(row.monto || 0).toLocaleString('es-CR', { minimumFractionDigits: 2 })}</td>
          <td class="p-4 font-mono text-xs text-slate-600">${row.numero_referencia || 'N/A'}</td>
          <td class="p-4 text-slate-700">${row.nombre_emisor || 'N/A'}</td>
          <td class="p-4 text-xs text-slate-500">${row.fecha_transferencia || row.created_at || 'N/A'}</td>
          <td class="p-4 text-center">
            ${row.imagen_url ? `
              <a href="${row.imagen_url}" target="_blank" class="text-emerald-600 hover:text-emerald-800 font-medium text-xs inline-flex items-center gap-1">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> Ver
              </a>
            ` : '<span class="text-slate-400 text-xs">Sin foto</span>'}
          </td>
        `;
        recordsTable.appendChild(tr);
      });

      document.getElementById('totalCount').innerText = data.length;
      document.getElementById('totalAmount').innerText = `₡${totalMonto.toLocaleString('es-CR', { minimumFractionDigits: 2 })}`;
    } else {
      recordsTable.innerHTML = `
        <tr>
          <td colspan="5" class="p-8 text-center text-slate-400 text-sm">
            No hay transacciones registradas aún.
          </td>
        </tr>
      `;
      document.getElementById('totalCount').innerText = '0';
      document.getElementById('totalAmount').innerText = '₡0.00';
    }
  } catch (e) {
    console.error('Error cargando tabla:', e);
  }
}

    function showAlert(msg, type) {
      alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'bg-emerald-50', 'text-emerald-700');
      alertBox.classList.add(type === 'error' ? 'bg-red-50' : 'bg-emerald-50', type === 'error' ? 'text-red-700' : 'text-emerald-700');
      alertBox.innerText = msg;
    }

    document.getElementById('refreshBtn').addEventListener('click', loadRecords);
    loadRecords();
  </script>
</body>
</html>
